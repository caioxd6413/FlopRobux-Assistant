
name: Gerar APK do FlopRobux Assistant

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source

      - name: Compilar APK
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$PROJECT"
          DIR=$(dirname "$PROJECT")
          gradle -p "$DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlopRobux-Assistant-APK
          path: source/**/build/outputs/apk/debug/*.apk
